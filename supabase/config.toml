# Local Supabase CLI configuration for YardPilotUSA.
# The hosted project is linked separately with:
# npx supabase@latest link --project-ref zuaikajypdcrbfcksiuf

project_id = "yardpilot"

# Authenticated owner/co-owner action.
[functions.stripe-connect-account]
enabled = true
verify_jwt = true

# Public customer checkout endpoint.
# The function validates the invoice share token itself.
[functions.create-invoice-checkout]
enabled = true
verify_jwt = false

# Public Stripe webhook endpoint.
# The function validates Stripe's webhook signature itself.
[functions.stripe-webhook]
enabled = true
verify_jwt = false

# Authenticated account-deletion action.
[functions.delete-account]
enabled = true
verify_jwt = false
# YardPilotUSA subscription checkout and customer portal require a signed-in owner/co-owner.
[functions.create-subscription-checkout]
enabled = true
verify_jwt = true

[functions.create-billing-portal]
enabled = true
verify_jwt = true

# Stripe authenticates this endpoint with its billing-webhook signature.
[functions.stripe-billing-webhook]
enabled = true
verify_jwt = false

# Promotional access-code redemption requires a signed-in owner/co-owner.
[functions.redeem-access-code]
enabled = true
verify_jwt = true

# Signed-in YardPilotUSA platform administrators can create one-use gift codes.
[functions.generate-gift-code]
enabled = true
verify_jwt = true

# Public support, waitlist, and privacy-limited client error endpoints.
[functions.submit-public-contact]
enabled = true
verify_jwt = false

[functions.subscribe-interest]
enabled = true
verify_jwt = false

[functions.report-client-error]
enabled = true
verify_jwt = false
