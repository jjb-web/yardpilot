# YardPilot Supabase Edge Function configuration.
project_id = "yardpilot"

[functions.stripe-connect-account]
enabled = true
verify_jwt = true

[functions.create-invoice-checkout]
enabled = true
# Public invoice customers do not have a YardPilot login. The function validates
# the unguessable invoice share token before creating a Checkout Session.
verify_jwt = false

[functions.stripe-webhook]
enabled = true
# Stripe authenticates this endpoint with the Stripe-Signature header.
verify_jwt = false

[functions.delete-account]
enabled = true
verify_jwt = true
